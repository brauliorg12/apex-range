# Sitio web estatico de Apex Range.
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.

map $uri $cache_control {
    default "no-cache";
    "~*\.[0-9a-f]{8,}\.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" "public, max-age=31536000, immutable";
    ~*^/assets/ "public, max-age=2592000";
    ~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss application/rss+xml image/svg+xml application/manifest+json;

    # Seguridad (siempre, incluso en errores). Cache-Control sin "always":
    # no se agrega en 404 para no cachear respuestas inexistentes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $cache_control;

    # Healthcheck interno del contenedor. No se expone via NPM.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # No exponer empaquetados/backups si se suben por error a website/.
    location ~* \.(?:zip|tar|gz|tgz|bz2|xz|7z|rar|bak|sql|env|log)$ {
        return 404;
    }

    # Assets: si no existen, 404 real (no fallback a index.html).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
    }

    # HTML y rutas profundas: replica el comportamiento del hosting actual
    # (Apache devuelve index.html para rutas inexistentes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
